# 描述项目配置
[project]

# 本项目的名字（也是打包出来的包名，必须和 src\app 的包结构对得上）
name = "llm-app-engineering"

# 本项目 llm-app-engineering 自己的版本号
version = "0.1.0"

# 本项目自己的一句话说明
description = "LLM application backend, built from scratch"

# 本项目运行所要求的 Python 解释器版本范围
requires-python = ">=3.12"

# 本项目依赖的第三方包清单
# < 用于防止 uv.lock --upgrade 后可能出现的破坏性升级（通过上界明确排除 3.x）
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "uvicorn[standard]>=0.54.0",
]

# ============ 下面是构建系统配置 ============
# 这一段回答的问题是：如果别人要「把本项目打包成一个可安装的包」，用哪个工具来干？

# 构建这个包时，需要先装上哪些工具（这里只要 hatchling 一个）。
# 注意 require 用的是「复数」+ 方括号 —— 因为它是【列表】，可以有多个
[build-system]
requires = ["hatchling"]

# 具体用哪个工具来执行构建。约定格式是 "包名.入口"（这里是 hatchling 的 build 模块）
build-backend = "hatchling.build"

# ============ 下面是告诉构建器：包在哪 ============
# 但我们的代码在 src/app（不是根目录下的 llm-app-engineering），所以要显式告诉它。
# 这里写的是【目录路径】：src 下面有个叫 app 的包
[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.16.10",
]

# ============ 类型检查工具 mypy 的配置 ============
# mypy 做的事：不运行代码，只读源码，检查"类型是否自相矛盾"
# 关键区别：pydantic 查【运行时的数据】，mypy 查【写代码时的代码】

# TOML的表头[]决定下面的键归谁
#（不加会让类型检查工具 mypy 的配置落到表头 [dependency-groups] 里面）
[tool.mypy]

# 告诉 mypy 按哪个 Python 版本的语法和标准库来理解代码
# （不同版本的标准库类型签名可能不同，写错版本会误报）
python_version = "3.12"

# strict = true 是一组严格检查的总开关（一条顶十几条）
# 最关键的两个后果：
#   1. 函数必须写类型注解，否则报 no-untyped-def
#   2. 类型不匹配立刻报错，不允许"含糊过去"
# 为什么开：错误在写代码时暴露，代价最低
strict = true

# 每次跑 mypy 时默认检查哪些路径（这样敲 `uv run mypy` 不带参数也是全项目）
# ⚠️ 2026-10-14 由 ["src"] 改为 ["."]：带路径与不带路径结果一致，避免"只查 4 个文件却显示全绿"
#    （mypy 默认就排除 .venv / 第三方目录，实测 .venv 里 643 个 .py 不会进检查）
files = ["."]

# 检查"永远执行不到"的代码（如 return 之后的语句）
# ⚠️ 实测：这一项【不在 strict 预设里】，必须显式开启
warn_unreachable = true

# ============ ruff 的配置 ============
# ruff 一个工具干两件事：format（排版）+ check（找可疑写法）
[tool.ruff]

# 一行的最大长度。超过就换行
# 100 是常见选择：比 79（PEP 8 旧建议）宽松，屏幕放得下，又不至于长到读不动
line-length = 100

# ⚠️ 把 markdown 排除在 ruff 之外
# ruff format 会格式化 .md 里 ```python 代码块；而文档里的示例是【教学材料】
# （刻意对齐的注释、故意报错的例子、不完整片段），被格式化后反而失去可读性
extend-exclude = ["*.md"]

[tool.ruff.lint]
# select = 启用哪些规则集
# ⚠️ ruff 默认只开一小部分（E4/E7/E9/F），这里显式点亮更多
# 每个字母是一个"规则家族"：
#   E  = pycodestyle 的 Error（缩进、空格等）
#   F  = Pyflakes（未使用的变量/import、未定义的名称等真正的 bug）
#   I  = isort（import 的排序与分组）
#   UP = pyupgrade（把旧写法升级成新写法，如用 X | None 代替 Optional[X]）
#   B  = flake8-bugbear（容易写出 bug 的写法，如可变默认参数）
select = ["E", "F", "I", "UP", "B", "TID"]

# ===== 只有 llm_client.py 允许直接 import httpx =====
# 用机械检查代替口头约定：任何其它文件绕过适配器直连上游，ruff 会直接报 TID251
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "上游调用必须走 LlmClient（src/app/llm_client.py），不要直接 import httpx"

# 适配器自己是唯一的例外
[tool.ruff.lint.per-file-ignores]
"src/app/llm_client.py" = ["TID251"]
# playground/ 是学习实验脚本，刻意直接写 httpx（不经过适配器），不是业务代码
"playground/*.py" = ["TID251"]
