# 单机部署栈（13a-2）。入口只有 nginx（2c），app 不再发布宿主端口
name: llm-app

# 【注意】：app 与 migrate 必须指向同一个库；两处各写一遍迟早漂移，所以用 YAML 锚点共享
x-database-url: &database-url "sqlite+aiosqlite:////app/data/app.db"

services:
  app:
    build:
      context: .
      args:
        # 【注意】：默认回落到 pypi.org，本机实测 10s 超时；构建时传 --build-arg（见 dev-environment §8.0c）
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: llm-app:dev
    env_file:
      - .env
    environment:
      # 【注意】：.env 里是 HOST=127.0.0.1（本地开发用）；容器必须 0.0.0.0，
      #   否则端口映射通了也没人监听 —— environment 优先级高于 env_file
      HOST: 0.0.0.0
      # 【注意】：加引号 —— YAML 会把裸 8000 解析成整数，而这列要字符串
      PORT: "8000"
      # 【注意】：四个斜杠 = 绝对路径 /app/data/app.db；三个斜杠是相对路径
      DATABASE_URL: *database-url
      # 【注意】：uvicorn 默认只信 127.0.0.1 的 X-Forwarded-For；不放开这一项，
      #   访问日志里的客户端 IP 会全是 nginx 的（#56）
      FORWARDED_ALLOW_IPS: "*"
    # 【注意】：迁移没成功就不启动 app —— 否则空库第一请求就是 no such table（#84、K93）
    depends_on:
      migrate:
        condition: service_completed_successfully
    # 【注意】：不再 publish 到宿主 —— 只有 compose 网络内的 proxy 能连（13a-2c）
    expose:
      - "8000"
    volumes:
      # 【注意】：必须命名卷不是 bind mount —— Linux 宿主上 bind mount 属主是 root:root，
      #   uid 10001 写不进去（本机 v9fs 是 777 掩盖了这一点），且实测慢 3.8 倍
      - app_data:/app/data
    # 【注意】：Docker 默认宽限期 10s，而优雅停机窗口默认 30s（决策 39）——
    #   默认值会让窗口走不完就被 SIGKILL；40s = 30s 窗口 + 10s 收尾余量
    stop_grace_period: 40s
    restart: unless-stopped

  # 一次性迁移服务：跑完就退出，退出码 0 才算成功（app 在等这个结果）
  migrate:
    # 【注意】：与 app 共用同一镜像，不重复定义 build —— compose 会先构建本项目的镜像再启动容器
    image: llm-app:dev
    command: ["python", "-m", "alembic", "upgrade", "head"]
    # 【注意】：只给数据库连接串，不给 env_file —— 迁移用不上 LLM_API_KEY，不该进这个容器
    environment:
      DATABASE_URL: *database-url
    volumes:
      # 【注意】：必须挂同一个卷，否则迁移改的是另一个库
      - app_data:/app/data
    # 【注意】：一次性的，失败就停在那里等人工看；自动重启只会刷日志掩盖失败
    restart: "no"

  # 反代：唯一对宿主发布端口的服务（13a-2c）
  proxy:
    image: nginx:1.29-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      # 【注意】：ro —— 容器不该改配置；挂到 conf.d 是替换镜像自带的默认站点
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # 【注意】：nginx 对 SIGTERM 是 fast shutdown（掐断在途连接），SIGQUIT 才优雅退出。
    #   而 compose stop 是「依赖者先停」（📎 实测 proxy → app），这一环决定在途流会不会被砍
    stop_signal: SIGQUIT
    stop_grace_period: 40s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  app_data:
