# 单机反代（13a-2c）：app 不再对宿主暴露端口，一切流量从 80 进来
# 【注意】：nginx 默认 proxy_buffering on —— 它会把 SSE 攒成一块再发，流式就废了
#   （📎 实测：5 帧 × 0.4s 的流，off 逐帧 0.07/0.47/0.87/…，on 则全部在 2.07s 到达）

# 【注意】：反代层错误（413/502/504）也要说应用的那种语言（#89）。
#   下面这张 map 把「请求带的 Origin」映射成「要回显的 Origin」，不在白名单就是空串；
#   空串时 nginx 会直接省略该响应头（📎 已实测：非法 Origin 下不出现 Access-Control-Allow-Origin）
# 【注意】：它与 src/app/constants.py 的 ALLOWED_ORIGINS 是同一份事实的两处副本 ——
#   改一边必须改另一边，tests/test_docker_assets.py 里有用例盯着
map $http_origin $cors_origin {
    default "";
    "http://localhost:5173" "http://localhost:5173";
    "http://127.0.0.1:5173" "http://127.0.0.1:5173";
}

# 【注意】：默认 combined 格式里没有 $request_id —— 那样回给客户端的 request_id
#   在任何日志里都搜不到（等于装饰品）。upst= 用来区分「没连上上游」(-) 与「上游回了 502」
log_format app_json_ext '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                        'rid=$request_id upst=$upstream_status rt=$request_time';

# 【注意】：必须自己解析服务名 —— nginx 默认在启动时把上游 IP 解析一次就缓存住，
#   app 重建换了 IP 之后会一直 502（📎 实测：app IP 从 .2 变 .4 后，日志
#   `connect() failed ... upstream: "http://172.18.0.2:8000"` 持续 502）
#   127.0.0.11 是 Docker 内嵌 DNS；valid=10s 让缓存最多活 10 秒
resolver 127.0.0.11 valid=10s ipv6=off;

upstream app_backend {
    # 【注意】：`resolve` 必须配共享内存 zone，否则 nginx -t 报错
    zone app_backend 64k;
    # 【注意】：写 compose 服务名，不能写 127.0.0.1 —— 反代容器里的回环不是 app
    server app:8000 resolve;
    # 【注意】：与 proxy_http_version 1.1 + 下方 Connection "" 三者缺一不可，否则 keepalive 不生效
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 【注意】：app 侧合法上限 ≈ 60k 字符（≈180 KB UTF-8），1m 留余量；
    #   超过 1m 由 nginx 直接回 413 —— 形状见下方 @json_413（#89 已修成 JSON）
    client_max_body_size 1m;

    # 覆盖 http 级默认格式，让 $request_id 真的能 grep 到
    access_log /var/log/nginx/access.log app_json_ext;

    # 【注意】：这三类错误是 【nginx 自己】产生的 —— app 根本没机会回话。
    #   默认它们回 HTML 页，客户端按 error.code 分支的代码会直接崩（#89）
    # 【注意】：绝不要开 proxy_intercept_errors —— 它会把 【app】返回的 413/502 也改写掉，
    #   破坏「上游的意思原样透传」（app 的 413 是 UPSTREAM_PAYLOAD_TOO_LARGE，含义不同）
    error_page 413 = @json_413;
    error_page 502 = @json_502;
    error_page 504 = @json_504;

    # 【注意】：`internal` = 只允许 nginx 内部跳转，外部直接访问这条路径拿不到；
    #   `= @json_413` 的等号表示「用该 location 产生的状态码」，所以 return 必须写同一个码
    location @json_413 {
        internal;
        # 【注意】：不写这句 nginx 会按默认 text/plain 回
        default_type application/json;
        # 【注意】：add_header 默认只对 200/201/204/206/301/302/303/304/307/308 生效，
        #   4xx/5xx 必须加 always —— 否则 413 上既没有 X-Request-ID 也没有 CORS 头
        add_header X-Request-ID $request_id always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        # 带 Origin 才加 CORS 头，就必须声明 Vary —— 否则中间缓存会把 A 源的响应给 B 源
        add_header Vary Origin always;
        # $request_id 由 nginx 插值，与上面响应头是同一个值（📎 已实测）
        return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"请求体超过 1 MB（反代层拒绝）","request_id":"$request_id"}}';
    }

    location @json_502 {
        internal;
        default_type application/json;
        add_header X-Request-ID $request_id always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary Origin always;
        return 502 '{"error":{"code":"BAD_GATEWAY","message":"后端服务不可用（连接不上或已退出）","request_id":"$request_id"}}';
    }

    location @json_504 {
        internal;
        default_type application/json;
        add_header X-Request-ID $request_id always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary Origin always;
        return 504 '{"error":{"code":"GATEWAY_TIMEOUT","message":"后端服务在期限内没有响应","request_id":"$request_id"}}';
    }

    # 只证明「nginx 活着」，不牵进 app（app 挂了不该让反代一起 unhealthy）
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # 【注意】：/metrics 只给容器网络内的抓取方 —— 宿主一律 404。
    #   为什么不用 allow/deny：📎 实测「外部请求」的源 IP 在不同堆栈里分别落在
    #   172.18.0.1 与 172.30.0.128 两个不同的段，写哪个白名单都会错（决策 50）
    location = /metrics {
        access_log off;
        return 404;
    }

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # 【注意】：真实客户端 IP 只能靠这几个头带过去；uvicorn 要配 FORWARDED_ALLOW_IPS 才认
        #   （默认只信 127.0.0.1，见待办 #56）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 铁三角：关缓冲 / 关缓存 / 超时大于应用侧总预算
        proxy_buffering off;
        proxy_cache off;
        # 【注意】：必须 > settings.upstream_total_timeout（默认 120s），否则 nginx 先掐断长流
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        # 【注意】：默认 60s —— 而容器停掉时 TCP SYN 是被【丢弃】不是被拒，用户要等满 60 秒
        #   才拿到 504（📎 实测 rt=60.060，见待办 #92）。同网络内握手 < 10ms，3s 已极宽
        proxy_connect_timeout 3s;
    }
}
