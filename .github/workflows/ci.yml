name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Format check
        run: uv run python scripts/check.py format

      - name: Lint
        run: uv run python scripts/check.py lint

      - name: Type check
        run: uv run python scripts/check.py mypy

      - name: Type check (editor parity)
        run: uv run python scripts/check.py pyright

      - name: Test
        run: uv run python scripts/check.py test
