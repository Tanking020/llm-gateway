name: Feature request
description: 提出一个能力或接口层面的改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 现在卡在哪
      description: 描述场景与约束，不要直接给方案（方案由维护者评估）
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你倾向的做法（可选）
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过但放弃的替代方案（可选）
      description: 有对比的提案更容易被接受 —— 决策记录里每条都要写「放弃了什么」
  - type: checkboxes
    id: scope
    attributes:
      label: 影响面
      options:
        - label: 会改端点契约（需要同步 api.md）
        - label: 会改数据结构（需要迁移）
        - label: 会改部署形态
        - label: 只是内部实现
